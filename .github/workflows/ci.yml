name: Service checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run check
      - run: git diff --exit-code docs/openapi.json docs/shipment.schema.json
      - name: Build deployment image
        run: docker build -t codex-flight-service:ci .
      - name: Verify browser in deployment image
        run: docker run --rm --init --shm-size=1g codex-flight-service:ci node dist/scripts/doctor.js
      - name: Verify CAPTCHA browser fixtures in deployment image
        run: docker run --rm --init --shm-size=1g codex-flight-service:ci node dist/scripts/check-captcha.js
      - name: Verify browser deadlines and dynamic result waits
        run: docker run --rm --init --shm-size=1g codex-flight-service:ci node dist/tests/browser.integration.js
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - name: Validate native installer syntax
        run: bash -n scripts/install-native.sh scripts/check-native-ci.sh
      - name: Verify real systemd services and Chromium
        run: sudo env CI=true FLIGHT_NODE_BIN="$(command -v node)" bash scripts/check-native-ci.sh
      - name: Native service diagnostics
        if: failure()
        run: sudo journalctl -u codex-flight-api -u codex-flight-worker --no-pager -n 100
